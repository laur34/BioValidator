[build-system]
# Tells pip what machinery to use to build your software packaging
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio_validator"
version = "0.1.0"
authors = [
    { name = "Laura Hardulak", email = "your.email@professionals.com" }
]
description = "A production-grade CLI tool to validate FASTA file structures and markers."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# 🛡️ Production Dependency Enforcement
# This ensures that anyone who installs your tool automatically downloads biopython
dependencies = [
    "biopython>=1.80"
]

[project.scripts]
# 🚀✨💫 This is the magic entry point!
# Syntax: command_name = "package.module:function"
# When a user runs 'bio-validate' in the terminal, it runs the main() function in cli.py
bio-validate = "bio_validator.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
